function scenarioByKey(k) { for (var i = 0; i < SCENARIOS.length; i++) if (SCENARIOS[i].key === k) return SCENARIOS[i]; return SCENARIOS[0]; }

/* Retention is a COMPARISON, not a timeout. A plugin's outcome carries when it
   was recorded; a source carries when that plugin last confirmed the key. A
   COMPLETE poll replaces its snapshot, so every key it carries was confirmed at
   that poll and the two timestamps agree. Anything older was RETAINED — which
   is exactly the two-of-ten distinction ADR-0056 said an environment-level
   banner could not make. No TTL, no frontend constant, no clock skew: both
   timestamps come from the same server in the same document. */
function retainedAgainst(sc, plugin, age) {
  var o = sc.discovery[plugin];
  return !!o && age > o.age;
}

function nodesFor(env) { return NODES.filter(function (n) { return n.envs.indexOf(env) >= 0; }); }
function edgesFor(env) { return EDGES.filter(function (e) { return e.envs.indexOf(env) >= 0; }); }
function nodeByKey(k) { for (var i = 0; i < NODES.length; i++) if (NODES[i].key === k) return NODES[i]; return null; }

function stateFor(sc, env, key) {
  var set = HEALTH_SETS[sc.healthSet] || {};
  var byEnv = set[env];
  /* staging has no incident/blind fixture — fall back to its baseline */
  if (!byEnv) byEnv = (HEALTH_SETS.baseline[env] || {});
  return byEnv[key] || NO_OBS;
}

/* ADR-0056: sources[] widens on the wire to {plugin, confirmedAt}. */
function sourcesFor(sc, node) {
  return node.sources.map(function (p) {
    var override = sc.confirm[node.key] && sc.confirm[node.key][p];
    var age = override !== undefined ? override : (sc.discovery[p] ? sc.discovery[p].age : 0);
    return { plugin: p, age: age, stale: retainedAgainst(sc, p, age) };
  });
}
function isRetained(sc, node) {
  return sourcesFor(sc, node).some(function (s) { return s.stale; });
}
/* Which health-capable plugins that *back* this node failed or degraded this
   cycle. Derived from backings (ADR-0013 routes health through them). */
function blindObservers(sc, node) {
  var out = [];
  node.backings.forEach(function (b) {
    if (!PLUGIN_META[b.plugin] || !PLUGIN_META[b.plugin].health) return;
    if (out.indexOf(b.plugin) >= 0) return;
    var o = sc.health[b.plugin];
    if (o && o.outcome !== "COMPLETE") out.push(b.plugin);
  });

        d.reasons ? h("div", { className: "obs-reason mono" }, d.reasons.join("; ")) : null,
        d.cause ? h("div", { className: "obs-reason mono" }, d.cause) : null,
        meta.health
          ? h(Fragment, null,
              h("div", { className: "obs-cap" },
                h("span", { className: "cap" }, "Health"),
                h(OutcomeGlyph, { outcome: hl.outcome, size: 11 }),
                h("span", { className: "val mono" + (hl.outcome === "COMPLETE" ? "" : " bad") }, hl.outcome),
                h("span", { className: "ago mono" }, "recorded " + ago(hl.age))),
              hl.reasons ? h("div", { className: "obs-reason mono" }, hl.reasons.join("; ")) : null,
              hl.cause ? h("div", { className: "obs-reason mono" }, hl.cause) : null)
          : h("div", { className: "obs-cap" },
              h("span", { className: "cap" }, "Health"),
              h("span", { className: "obs-na" }, "no Health capability — this is where UNKNOWN comes from"))));
  }));
}

/* ============================================================
   8. Canvas
   ============================================================ */

var GEOM = { dx: 274, dy: 132, ox: 60, oy: 80 };
var RANK = { COMPLETE: 0, PARTIAL: 1, FAILED: 2 };

function buildGraph(variant, env, sc, showMetrics, selectedKey) {
  var lay = layout(env);
  var reach = reachability(lay, selectedKey);

  var rfNodes = lay.nodes.map(function (n) {
    var s = stateFor(sc, env, n.key);
    var d = descriptorFor(n.type);
    var blind = blindObservers(sc, n);
    var srcs = sourcesFor(sc, n);

    /* Variant C's coverage row: every plugin that touches this node, with the
       outcome of whatever capability it is providing here. */
    var coverage = [];
    var cov = {};
    function note(p, outcome, stale) {
      if (!cov[p]) { cov[p] = { plugin: p, outcome: outcome, stale: !!stale }; coverage.push(cov[p]); return; }
      if (RANK[outcome] > RANK[cov[p].outcome]) cov[p].outcome = outcome;
      if (stale) cov[p].stale = true;
    }
    n.sources.forEach(function (p) {
      var srow = srcs.filter(function (x) { return x.plugin === p; })[0];
      note(p, sc.discovery[p].outcome, srow && srow.stale);
    });
    n.backings.forEach(function (b) {
      if (!PLUGIN_META[b.plugin] || !PLUGIN_META[b.plugin].health) return;
      note(b.plugin, sc.health[b.plugin].outcome, false);
    });
    coverage.forEach(function (c) { c.bad = c.outcome !== "COMPLETE"; });

    return {
      id: n.key, type: "card", position: { x: GEOM.ox + lay.layer[n.key] * GEOM.dx, y: GEOM.oy + (lay.slot[n.key] || 0) * GEOM.dy },
      draggable: true,
      data: {
        marks: variant === "B" || variant === "D",
        coverageRow: variant === "C",
        displayName: n.displayName, typeLabel: d.label, icon: d.icon,
        health: s.health, metric: metricLine(s, n), sources: n.sources,
        showMetrics: showMetrics, role: nodeRole(reach, n.key, selectedKey),
        retained: isRetained(sc, n), blind: blind,
        blindOutcome: blind.length ? sc.health[blind[0]].outcome : "COMPLETE",
        coverage: coverage
      }
    };
  });

  var rfEdges = lay.edges.map(function (e) {
    var role = edgeRole(reach, e, selectedKey);
    var dim = role === "off";
    var stroke = role === "up" ? "var(--accent)" : role === "down" ? "var(--h-degraded)" : "var(--line-strong)";
    return {
      id: e.fromKey + "->" + e.toKey, source: e.fromKey, target: e.toKey, type: "default",
      animated: role === "down",
      label: role && role !== "off" ? RELATIONS[e.relation].forward : undefined,
      style: { stroke: stroke, strokeWidth: role && role !== "off" ? 2 : 1.4, opacity: dim ? 0.2 : 1 },
      markerEnd: { type: MarkerType.ArrowClosed, width: 14, height: 14, color: dim ? "var(--line-strong)" : stroke }
    };
  });

  return { nodes: rfNodes, edges: rfEdges, lay: lay };
}

function Canvas(props) {
  var g = props.graph;
  var rf = useRef(null);
  var ns = XY.useNodesState([]);
  var rfNodes = ns[0], setRfNodes = ns[1], onNodesChange = ns[2];

  useEffect(function () {
    setRfNodes(function (prev) {
      var byId = {};
      prev.forEach(function (p) { byId[p.id] = p; });
      return g.nodes.map(function (n) {
        var p = byId[n.id];
        return p && p.measured ? Object.assign({}, n, { measured: p.measured }) : n;
      });
    });
  }, [g]);

  useEffect(function () {
    if (rf.current) {
      var t = setTimeout(function () { rf.current && rf.current.fitView({ padding: 0.16, duration: 300 }); }, 60);
      return function () { clearTimeout(t); };
    }
  }, [props.env, props.variant, props.showMetrics]);

  return h(XY.ReactFlow, {
    nodes: rfNodes, edges: g.edges, onNodesChange: onNodesChange, nodeTypes: props.nodeTypes,
    onInit: function (inst) { rf.current = inst; inst.fitView({ padding: 0.16 }); },
    onNodeClick: function (_, n) { props.onSelect(n.id); },
    onPaneClick: function () { props.onSelect(null); },
    nodesConnectable: false, elementsSelectable: true,
    proOptions: { hideAttribution: true }, minZoom: 0.25, maxZoom: 2
  },
    h(XY.Background, { gap: 22, size: 1.6, color: "var(--canvas-dot)" }),
    h(XY.Controls, { showInteractive: false }));
}

/* ============================================================
   9. App shell
   ============================================================ */

var VARIANTS = [
  { key: "A", name: "Quiet rail",     blurb: "Outcome is environment-level and lives beside the environment switcher. The canvas is untouched; freshness is inspector detail." },
  { key: "B", name: "Exception mark", blurb: "Nothing renders while everything is COMPLETE. A non-COMPLETE poll raises a banner and marks exactly the nodes it touched." },
  { key: "C", name: "Second channel", blurb: "“How well we looked” is a permanent peer of “what we found”: a rail strip, a coverage row on every node, and its own inspector section." },
  { key: "D", name: "Merged",          blurb: "B's exception marks, plus A's resting chip so the banner has somewhere to have come from." }
];

var NOTES = {
  A: { lead: "Outcome is a property of the environment, not of ten nodes.",
       body: "A plugin either worked or it did not, and that is one fact per environment — so it sits in the rail beside the thing it is scoped to. The canvas keeps its one job: is anything watching this node?",
       cost: "Cost: the chip is the only thing standing between a FAILED plugin and a green canvas. Try `blind` and see how long it takes to notice." },
  B: { lead: "Nothing is decorated until something is wrong.",
       body: "Four of ten nodes are permanently UNKNOWN with every plugin perfectly healthy, so a permanent indicator is a permanent false alarm. A non-COMPLETE outcome raises a banner and hatches exactly the nodes it retained — ADR-0056's objection to the blanket banner, answered per node.",
       cost: "Cost: two new canvas encodings that only ever appear during trouble, so nobody has seen them before the day they matter." },
  D: { lead: "Quiet by default, loud exactly where it bit.",
       body: "The rail chip is always there, so “is everything actually being watched?” is answerable on a good day and the trouble encodings have somewhere to have come from. Nothing else renders until a poll comes back non-COMPLETE — then a banner names the plugin and cause, a hatched edge marks the nodes it retained, and a border marks the nodes whose observer went blind. The caveat sits inside Health, next to the value it qualifies.",
       cost: "Cost: three encodings instead of one, and the chip reads “all complete” for weeks at a time — which is the price of it being there on the day it does not." },
  C: { lead: "Two questions, two channels, everywhere.",
       body: "ADR-0026 split `health` from `outcome` because they answer different questions. This variant takes that literally: every surface that renders health also renders how well we looked — monochrome squares, so `outcome` never competes for the hue channel health owns.",
       cost: "Cost: a fifth line on every node card, including the four that will never have an observer, and ≈ an eighth of the drawer spent on a section that reads COMPLETE COMPLETE COMPLETE most days." }
};

function readVariant() {
  try {
    var p = new URLSearchParams(window.location.search).get("variant");
    if (p && ["A", "B", "C", "D"].indexOf(p.toUpperCase()) >= 0) return p.toUpperCase();
  } catch (e) {}
  return "D";
}
function writeVariant(v) {
  try { var u = new URL(window.location.href); u.searchParams.set("variant", v); window.history.replaceState({}, "", u); } catch (e) {}
}

function App() {
  var vv = useState(readVariant()), variant = vv[0], setVariant = vv[1];
  var ee = useState("production"), env = ee[0], setEnv = ee[1];
  var ss = useState("baseline"), scenarioKey = ss[0], setScenarioKey = ss[1];
  var mm = useState(true), showMetrics = mm[0], setShowMetrics = mm[1];
  var kk = useState(null), selectedKey = kk[0], setSelectedKey = kk[1];
  var pp = useState(false), popOpen = pp[0], setPopOpen = pp[1];
  var bb = useState(false), bannerDismissed = bb[0], setBannerDismissed = bb[1];

  var sc = scenarioByKey(scenarioKey);
  var summary = outcomeSummary(sc);

  useEffect(function () { writeVariant(variant); }, [variant]);
  useEffect(function () { if (env === "staging" && scenarioKey !== "baseline") setScenarioKey("baseline"); }, [env]);
  useEffect(function () { setBannerDismissed(false); }, [scenarioKey, variant, env]);
  useEffect(function () {
    if (selectedKey && !nodesFor(env).some(function (n) { return n.key === selectedKey; })) setSelectedKey(null);
  }, [env]);

  useEffect(function () {
    function onKey(ev) {
      var t = ev.target;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
      if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") {
        var i = VARIANTS.findIndex(function (x) { return x.key === variant; });
        setVariant(VARIANTS[(i + (ev.key === "ArrowRight" ? 1 : -1) + VARIANTS.length) % VARIANTS.length].key);
        ev.preventDefault();
      }
      if (ev.key === "Escape") { setSelectedKey(null); setPopOpen(false); }
    }
    window.addEventListener("keydown", onKey);
    return function () { window.removeEventListener("keydown", onKey); };
  }, [variant]);

  var graph = useMemo(function () {
    return buildGraph(variant, env, sc, showMetrics, selectedKey);
  }, [variant, env, sc, showMetrics, selectedKey]);

  var nodeTypes = useMemo(function () { return { card: NodeCard }; }, []);

  var selectedNode = selectedKey ? nodeByKey(selectedKey) : null;
  var selectedState = selectedKey ? stateFor(sc, env, selectedKey) : NO_OBS;

  var ns = nodesFor(env);
  var counts = HEALTH_ORDER.map(function (x) {
    return { h: x, n: ns.filter(function (n) { return stateFor(sc, env, n.key).health === x; }).length };
  }).filter(function (c) { return c.n > 0; });

  var affected = ns.filter(function (n) { return isRetained(sc, n) || blindObservers(sc, n).length > 0; });
  var cur = VARIANTS.filter(function (x) { return x.key === variant; })[0];

  /* ---- rail ---- */
  var chipLabel = summary.worst === "COMPLETE"
    ? "4 plugins · all complete"
    : summary.failed
      ? summary.failed + " failed" + (summary.partial ? " · " + summary.partial + " partial" : "")
      : summary.partial + " partial";

  var railChip = (variant === "A" || variant === "D")
    ? h("div", { style: { position: "relative" } },
        h("button", {
          className: "obs-chip" + (summary.worst === "COMPLETE" ? "" : " alert"),
          "aria-expanded": popOpen, onClick: function () { setPopOpen(!popOpen); } },
          h(OutcomeGlyph, { outcome: summary.worst, size: 12 }), chipLabel,
          h("span", { style: { color: "var(--muted)", fontSize: 11 } }, popOpen ? "▴" : "▾")),
        popOpen
          ? h("div", { className: "obs-pop", style: { top: 38, left: 0 } },
              h("div", { className: "obs-pop-head" },
                h(Eyebrow, null, "Plugin outcome · " + env),
                h("div", { style: { fontSize: 11.5, color: "var(--ink-2)", marginTop: 4 } },
                  "How well we looked. Not what we found — that is the health column on the canvas.")),
              h(OutcomeRows, { sc: sc }))
          : null)
    : null;

  var rail = h("div", { className: "rail" },
    h("div", { className: "rail-brand" }, h("b", null, "Nodqora"), h("span", { className: "eyebrow" }, "Payments pipeline")),
    h("div", { className: "rail-group" },
      h(Eyebrow, null, "Environment"),
      h("div", { className: "seg" }, ["production", "staging"].map(function (x) {
        return h("button", { key: x, "aria-pressed": env === x, onClick: function () { setEnv(x); } }, x); }))),
    railChip,
    h("div", { className: "rail-group" },
      h(Eyebrow, null, "Fixture"),
      h("div", { className: "seg" }, SCENARIOS.map(function (x) {
        return h("button", { key: x.key, "aria-pressed": scenarioKey === x.key,
          disabled: env === "staging" && x.key !== "baseline",
          title: env === "staging" && x.key !== "baseline" ? "The fixture defines this scenario for production only" : x.blurb.replace(/`/g, ""),
          onClick: function () { setScenarioKey(x.key); } }, x.label); }))),
    h("div", { className: "rail-spacer" }),
    h("div", { className: "counts" },
      h("b", null, ns.length), " nodes  ",
      counts.map(function (c) {
        return h("span", { key: c.h, className: "legend-item", style: { display: "inline-flex", marginLeft: 10 } },
          h(HealthGlyph, { health: c.h, size: 10 }), h("span", { className: "mono" }, c.n)); })),
    h("span", { className: "counts mono", style: { borderLeft: "1px solid var(--line)", paddingLeft: 14 } }, ENV_CONFIG[env].namespace));

  /* ---- variant B banner ---- */
  var banner = ((variant === "B" || variant === "D") && summary.worst !== "COMPLETE" && !bannerDismissed)
    ? h("div", { className: "obs-banner" },
        h(OutcomeGlyph, { outcome: summary.worst, size: 15 }),
        h("div", { className: "grow" },
          h("b", null, summary.items.filter(function (i) { return i.o.outcome !== "COMPLETE"; })
            .map(function (i) { return i.plugin + " " + i.capability + " " + i.o.outcome; }).join(" · ")),
          h("div", { className: "why mono" },
            summary.items.filter(function (i) { return i.o.outcome !== "COMPLETE"; })
              .map(function (i) { return i.o.cause || (i.o.reasons || []).join("; "); }).filter(Boolean)[0] || "")),
        h("span", { className: "why mono" }, affected.length + " of " + ns.length + " nodes affected"),
        h("button", { onClick: function () { setSelectedKey(affected.length ? affected[0].key : null); } }, "Show affected"),
        h("button", { onClick: function () { setBannerDismissed(true); } }, "Dismiss"))
    : null;

  /* ---- variant C strip ---- */
  var strip = variant === "C"
    ? h("div", { className: "obs-strip" },
        h("span", { className: "eyebrow", style: { marginRight: 4 } }, "Observation"),
        PLUGINS.map(function (p) {
          var d = sc.discovery[p], hl = sc.health[p];
          var bad = d.outcome !== "COMPLETE" || (hl && hl.outcome !== "COMPLETE");
          return h("span", { key: p, className: "obs-pill" + (bad ? " alert" : ""),
            title: (d.cause || (d.reasons || []).join("; ") || "") + " " + ((hl && (hl.cause || (hl.reasons || []).join("; "))) || "") },
            h("b", { className: "mono" }, p),
            h(OutcomeGlyph, { outcome: d.outcome, size: 10 }),
            h("span", { className: "ago mono" }, "disc " + ago(d.age)),
            h("span", { className: "sep" }, "│"),
            hl ? h(Fragment, null,
                  h(OutcomeGlyph, { outcome: hl.outcome, size: 10 }),
                  h("span", { className: "ago mono" }, "health " + ago(hl.age)))
               : h("span", { className: "ago mono" }, "no health capability"));
        }),
        h("span", { className: "rail-spacer" }),
        h("span", { className: "ago mono", style: { color: "var(--muted)", fontSize: 10.5 } },
          "graph 5m · state 30s"))
    : null;

  var n = NOTES[variant];
  var note = h("div", { className: "note" },
    h("b", null, n.lead), " ", n.body,
    h("span", { className: "cost" }, n.cost));

  var stage = h("div", { className: "stage" },
    h("div", { className: "canvas-wrap" },
      banner,
      h("div", { className: "canvas-inner" },
        h(Canvas, { graph: graph, variant: variant, nodeTypes: nodeTypes, env: env,
          showMetrics: showMetrics, onSelect: function (k) { setSelectedKey(k); setPopOpen(false); } }),
        note)),
    h(Drawer, { node: selectedNode, state: selectedState, env: env, sc: sc, variant: variant,
      onClose: function () { setSelectedKey(null); }, onSelect: setSelectedKey }));

  function cycle(dir) {
    var i = VARIANTS.findIndex(function (x) { return x.key === variant; });
    setVariant(VARIANTS[(i + dir + VARIANTS.length) % VARIANTS.length].key);
  }

  var switcher = h("div", { className: "switcher", role: "group", "aria-label": "Prototype variant" },
    h("button", { onClick: function () { cycle(-1); }, "aria-label": "Previous variant" }, "‹"),
    h("span", { className: "label" }, h("b", null, cur.key), " — ", cur.name),
    h("button", { onClick: function () { cycle(1); }, "aria-label": "Next variant" }, "›"),
    h("span", { className: "hint" }, "← →"));

  return h(Fragment, null, rail, strip, stage, switcher);
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));

})();
</script>
