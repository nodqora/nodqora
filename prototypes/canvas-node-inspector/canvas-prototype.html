   2. Selectors + layout

function nodesFor(env) { return NODES.filter(function (n) { return n.envs.indexOf(env) >= 0; }); }
function edgesFor(env) { return EDGES.filter(function (e) { return e.envs.indexOf(env) >= 0; }); }

  var byEnv = STATES[scenario] && STATES[scenario][env];
  return (byEnv && byEnv[key]) || NO_ADAPTER;

function nodeByKey(key) { for (var i = 0; i < NODES.length; i++) if (NODES[i].key === key) return NODES[i]; return null; }

/* Layered longest-path over flow-directed edges, then a greedy slot
   assignment so a branch keeps its predecessor's row. Good enough for a
   pipeline DAG, and it re-flows correctly when staging drops three nodes. */
function layout(env) {
  var ns = nodesFor(env), es = edgesFor(env);
  var preds = {}, succs = {};
  ns.forEach(function (n) { preds[n.key] = []; succs[n.key] = []; });
  es.forEach(function (e) { if (preds[e.toKey]) preds[e.toKey].push(e.fromKey); if (succs[e.fromKey]) succs[e.fromKey].push(e.toKey); });

  var layer = {};
  ns.forEach(function (n) { layer[n.key] = 0; });
  for (var pass = 0; pass < ns.length; pass++) {
    var moved = false;
    ns.forEach(function (n) {
      preds[n.key].forEach(function (p) {
        if (layer[p] + 1 > layer[n.key]) { layer[n.key] = layer[p] + 1; moved = true; }
      });
    });
    if (!moved) break;
  }

  var byLayer = {};
  ns.forEach(function (n) { (byLayer[layer[n.key]] = byLayer[layer[n.key]] || []).push(n.key); });

  var slot = {};
  Object.keys(byLayer).map(Number).sort(function (a, b) { return a - b; }).forEach(function (l) {
    var taken = {};
    byLayer[l].forEach(function (k) {
      var want = 0;
      for (var i = 0; i < preds[k].length; i++) {
        if (slot[preds[k][i]] !== undefined) { want = slot[preds[k][i]]; break; }
      }
      while (taken[want]) want++;
      taken[want] = true; slot[k] = want;
    });
  });

  return { layer: layer, slot: slot, preds: preds, succs: succs, nodes: ns, edges: es };
}

/* Upstream / downstream reachability from the selected node. */
function reachability(lay, selectedKey) {
  if (!selectedKey) return null;
  var up = {}, down = {};
  function walk(key, adj, into) {
    (adj[key] || []).forEach(function (k) { if (!into[k]) { into[k] = true; walk(k, adj, into); } });
  }
  walk(selectedKey, lay.preds, up);
  walk(selectedKey, lay.succs, down);
  return { up: up, down: down };
}
function nodeRole(reach, key, selectedKey) {
  if (!reach) return null;
  if (key === selectedKey) return "self";
  if (reach.up[key]) return "up";
  if (reach.down[key]) return "down";
  return "off";
}
function edgeRole(reach, e, selectedKey) {
  if (!reach) return null;
  var f = e.fromKey, t = e.toKey;
  var upSide = function (k) { return k === selectedKey || reach.up[k]; };
  var downSide = function (k) { return k === selectedKey || reach.down[k]; };
  if (upSide(f) && upSide(t)) return "up";
  if (downSide(f) && downSide(t)) return "down";
  return "off";
}

var fmt = function (n) { return typeof n === "number" ? n.toLocaleString("en-US") : String(n); };

/* One-line metric summary per node, from NodeState.metrics. */
function metricLine(st, node) {
  var m = st.metrics || {}, out = [];
  if (m.kubernetes && m.kubernetes.desiredReplicas !== undefined) out.push(m.kubernetes.readyReplicas + "/" + m.kubernetes.desiredReplicas + " ready");
  if (m.connect && m.connect.totalTasks !== undefined) out.push(m.connect.runningTasks + "/" + m.connect.totalTasks + " tasks");
  if (m.kafka && m.kafka.maxConsumerLag !== undefined) out.push("lag " + fmt(m.kafka.maxConsumerLag));
  else if (m.kafka && m.kafka.consumerLag !== undefined) out.push("lag " + fmt(m.kafka.consumerLag));
  if (!out.length && node && !node.backings.length) out.push("not observed");
  return out.join("  ·  ");
}

}

/* ============================================================
   5. Variant A — Flowline
      Left-to-right pipeline · card nodes · right drawer.
   ============================================================ */

function NodeA(props) {
  var d = props.data;
  var cls = ["a-node"];
  if (d.role && d.role !== "self") cls.push(d.role === "off" ? "n-off" : "n-" + d.role);
  if (d.role === "self") cls.push("n-self");
  return h("div", { className: cls.join(" ") },
    h(XY.Handle, { type: "target", position: Position.Left }),
    h("div", { className: "a-body" },
      h("div", { className: "a-rail bg-" + d.health, style: { background: "var(--h-" + d.health.toLowerCase() + ")", borderRadius: 2 } }),
      h(Icon, { name: d.icon, className: "a-icon" }),
      h("div", { className: "a-text" },
        h("div", { className: "a-name", title: d.displayName }, d.displayName),
        h("div", { className: "a-type" }, d.typeLabel))),
    h("div", { className: "a-foot" },
      h(HealthGlyph, { health: d.health, size: 11 }),
      h("span", { className: "a-metric mono" }, d.showMetrics && d.metric ? d.metric : HEALTH_LABEL[d.health]),
      h("span", { className: "a-src mono", style: { marginLeft: "auto" } }, d.sources.join(" "))),
    h(XY.Handle, { type: "source", position: Position.Right })
  );
}

function DrawerInspector(props) {
  var node = props.node;
  if (!node) {
    return h("div", { className: "drawer" },
      h("div", { className: "sec", style: { paddingTop: 22 } },
        h(Eyebrow, null, "Node inspector"),
        h("p", { style: { color: "var(--muted)", fontSize: 12.5, marginTop: 8 } },
          "Select a node to inspect it. Selecting also highlights everything upstream (blue) and downstream (amber) of it."),
        h("div", { style: { marginTop: 18 } },
          h(Eyebrow, null, "Health"),
          h("div", { className: "legend", style: { marginTop: 8 } },
            HEALTH_ORDER.map(function (hh) {
              return h("span", { className: "legend-item", key: hh },
                h(HealthGlyph, { health: hh, size: 12 }), HEALTH_LABEL[hh]);
            })))));
  }
  return h("div", { className: "drawer" },
    h("div", { className: "drawer-scroll" },
      h(InspectorHead, { node: node, state: props.state, env: props.env, onClose: props.onClose }),
      h(SecHealth, { state: props.state, node: node }),
      h(SecConnections, { env: props.env, node: node, onSelect: props.onSelect }),
      h(SecOwner, { node: node }),
      h(SecLinks, { node: node }),
      h(SecBackings, { node: node }),
      h(SecMetaProv, { node: node })));
}

/* ============================================================
   6. Variant B — Lanes
      Ownership is the vertical axis; flow is still horizontal.
      Inspector is a full-width bottom panel in three columns.
   ============================================================ */

var LANES = [
  { key: "payments-platform", label: "Payments Platform", bg: "var(--lane-a)" },
  { key: "data-platform",     label: "Data Platform",     bg: "var(--lane-b)" },
  { key: "__none__",          label: "Unowned",           bg: "var(--lane-c)" }
];

function NodeB(props) {
  var d = props.data;
  var cls = ["b-chip"];
  if (d.role && d.role !== "self") cls.push(d.role === "off" ? "n-off" : "n-" + d.role);
  if (d.role === "self") cls.push("n-self");
  return h("div", { className: cls.join(" ") },
    h(XY.Handle, { type: "target", position: Position.Left }),
    h("div", { className: "b-bar", style: { background: "var(--h-" + d.health.toLowerCase() + ")" } }),
    h("div", { className: "b-in" },
      h("div", { className: "b-name mono", title: d.displayName }, d.displayName),
      h("div", { className: "b-sub" },
        h(HealthGlyph, { health: d.health, size: 9 }),
        h("span", null, d.showMetrics && d.metric ? d.metric : d.typeLabel),
        d.declared ? h("span", { className: "b-declared" }, "declared") : null)),
    h(XY.Handle, { type: "source", position: Position.Right })
  );
}

function PanelInspector(props) {
  var node = props.node;
  if (!node) return null;
  return h("div", { className: "panel" },
    h("div", { className: "panel-col" },
      h(InspectorHead, { node: node, state: props.state, env: props.env, onClose: props.onClose }),
      h(SecHealth, { state: props.state, node: node })),
    h("div", { className: "panel-col" },
      h(SecConnections, { env: props.env, node: node, onSelect: props.onSelect }),
      h(SecBackings, { node: node })),
    h("div", { className: "panel-col" },
      h(SecOwner, { node: node }),
      h(SecLinks, { node: node }),
      h(SecMetaProv, { node: node })));
}

/* ============================================================
   7. Variant C — Console
      Top-down · signals always on · inspector is a popover
      anchored beside the node, so the graph keeps the screen.
   ============================================================ */

function NodeC(props) {
  var d = props.data;
  var cls = ["c-node"];
  if (d.role && d.role !== "self") cls.push(d.role === "off" ? "n-off" : "n-" + d.role);
  if (d.role === "self") cls.push("n-self");
  var tint = "var(--h-" + d.health.toLowerCase() + ")";
  return h("div", { className: cls.join(" "), style: { borderLeftColor: tint, background: d.health === "HEALTHY" ? "var(--surface)" : "var(--h-" + d.health.toLowerCase() + "-bg)" } },
    h(XY.Handle, { type: "target", position: Position.Top }),
    h("div", { className: "c-head" },
      h(Icon, { name: d.icon, className: "c-icon", }),
      h("span", { className: "c-name mono", title: d.displayName }, d.displayName),
      h("span", { className: "c-state h-" + d.health }, HEALTH_LABEL[d.health].toUpperCase())),
    d.showMetrics
      ? h("div", { className: "c-signal mono" },
          h("div", null, d.rawSignal || h("span", { className: "k" }, "no signal — nothing observes this node")),
          d.metric ? h("div", { className: "k", style: { marginTop: 2 } }, d.metric) : null)
      : null,
    h(XY.Handle, { type: "source", position: Position.Bottom })
  );
}

function PopInspector(props) {
  var node = props.node;
  var tabs = ["Overview", "Connections", "Go to"];
  var tabState = useState("Overview"), tab = tabState[0], setTab = tabState[1];
  useEffect(function () { setTab("Overview"); }, [node && node.key]);
  if (!node) return null;
  return h("div", { className: "pop", style: props.anchor },
    h(InspectorHead, { node: node, state: props.state, env: props.env, onClose: props.onClose }),
    h("div", { className: "tabs", role: "tablist" }, tabs.map(function (t) {
      return h("button", { key: t, role: "tab", "aria-selected": tab === t, onClick: function () { setTab(t); } }, t);
    })),
    h("div", { className: "pop-scroll" },
      tab === "Overview" ? h(Fragment, null,
        h(SecHealth, { state: props.state, node: node }),
        h(SecBackings, { node: node }),
        h(SecMetaProv, { node: node })) : null,
      tab === "Connections" ? h(SecConnections, { env: props.env, node: node, onSelect: props.onSelect }) : null,
      tab === "Go to" ? h(Fragment, null,
        h(SecOwner, { node: node }),
        h(SecLinks, { node: node })) : null));
}

/* ============================================================
   8. Canvas assembly
   ============================================================ */

var NODE_TYPES = { A: NodeA, B: NodeB, C: NodeC };
var VARIANTS = [
  { key: "A", name: "Flowline",  blurb: "Left-to-right pipeline · card nodes · right drawer" },
  { key: "B", name: "Lanes",     blurb: "Swimlanes by owning team · compact chips · bottom panel" },
  { key: "C", name: "Console",   blurb: "Top-down · signals always on · popover anchored to the node" }
];

var GEOM = {
  A: { dx: 268, dy: 128, w: 210, ox: 60, oy: 80 },
  B: { dx: 232, dy: 0,   w: 178, ox: 60, oy: 0 },
  C: { dx: 300, dy: 176, w: 250, ox: 60, oy: 60 }
};
var LANE_H = 150;

function buildGraph(variant, env, scenario, showMetrics, selectedKey) {
  var lay = layout(env);
  var reach = reachability(lay, selectedKey);
  var g = GEOM[variant];

  var rfNodes = lay.nodes.map(function (n) {
    var st = stateFor(scenario, env, n.key);
    var d = descriptorFor(n.type);
    var x, y;
    if (variant === "B") {
      var laneIdx = LANES.findIndex(function (l) { return l.key === (n.ownerKey || "__none__"); });
      var within = lay.slot[n.key] || 0;
      x = g.ox + lay.layer[n.key] * g.dx;
      y = 46 + laneIdx * LANE_H + within * 52 + 34;
    } else if (variant === "C") {
      x = g.ox + (lay.slot[n.key] || 0) * g.dx;
      y = g.oy + lay.layer[n.key] * g.dy;
    } else {
      x = g.ox + lay.layer[n.key] * g.dx;
      y = g.oy + (lay.slot[n.key] || 0) * g.dy;
    }
    return {
      id: n.key, type: variant, position: { x: x, y: y }, draggable: true,
      data: {
        displayName: n.displayName, typeLabel: d.label, icon: d.icon,
        health: st.health, rawSignal: st.rawSignal, metric: metricLine(st, n),
        sources: n.sources, declared: n.backings.length === 0,
        showMetrics: showMetrics, role: nodeRole(reach, n.key, selectedKey)
      }
    };
  });

  var rfEdges = lay.edges.map(function (e) {
    var role = edgeRole(reach, e, selectedKey);
    var dim = role === "off";
    var stroke = role === "up" ? "var(--accent)"
               : role === "down" ? "var(--h-degraded)"
               : "var(--line-strong)";
    var showLabel = variant === "C" || (variant === "A" && role && role !== "off");
    return {
      id: e.fromKey + "->" + e.toKey,
      source: e.fromKey, target: e.toKey,
      type: variant === "B" ? "smoothstep" : "default",
      animated: role === "down",
      label: showLabel ? RELATIONS[e.relation].forward : undefined,
      style: { stroke: stroke, strokeWidth: role && role !== "off" ? 2 : 1.4, opacity: dim ? 0.2 : 1 },
      markerEnd: { type: MarkerType.ArrowClosed, width: 14, height: 14, color: dim ? "var(--line-strong)" : stroke }
    };
  });

  return { nodes: rfNodes, edges: rfEdges, lay: lay };
}

function Canvas(props) {
  var g = props.graph, variant = props.variant;
  var rf = useRef(null);

  /* XYFlow writes measured dimensions back through onNodesChange. Rebuilding
     the array on every selection would throw those away — and the minimap only
     draws nodes that have them — so carry `measured` across rebuilds by id. */
  var ns = XY.useNodesState([]);
  var rfNodes = ns[0], setRfNodes = ns[1], onNodesChange = ns[2];

  useEffect(function () {
    setRfNodes(function (prev) {
      var byId = {};
      prev.forEach(function (p) { byId[p.id] = p; });
      return g.nodes.map(function (n) {
        var p = byId[n.id];
        return p && p.measured ? Object.assign({}, n, { measured: p.measured }) : n;
      });
    });
  }, [g]);

  useEffect(function () {
    if (rf.current) {
      var t = setTimeout(function () { rf.current && rf.current.fitView({ padding: 0.16, duration: 300 }); }, 60);
      return function () { clearTimeout(t); };
    }
  }, [props.env, variant, props.showMetrics]);

  return h(XY.ReactFlow, {
    nodes: rfNodes, edges: g.edges,
    onNodesChange: onNodesChange,
    nodeTypes: props.nodeTypes,
    onInit: function (inst) { rf.current = inst; inst.fitView({ padding: 0.16 }); },
    onNodeClick: function (_, n) { props.onSelect(n.id); },
    onPaneClick: function () { props.onSelect(null); },
    nodesConnectable: false, elementsSelectable: true,
    proOptions: { hideAttribution: true },
    minZoom: 0.25, maxZoom: 2,
    defaultEdgeOptions: { type: "default" }
  },
    h(XY.Background, { gap: 22, size: 1.6, color: "var(--canvas-dot)" }),
    h(XY.Controls, { showInteractive: false }),
    variant !== "B" ? h(XY.MiniMap, { pannable: true, zoomable: true, maskColor: "rgba(0,0,0,.06)",
      nodeColor: function (n) { return HEALTH_HEX[n.data.health]; } }) : null,
    props.children);
}

/* ============================================================
   9. App shell
   ============================================================ */

function readVariant() {
  try {
    var p = new URLSearchParams(window.location.search).get("variant");
    if (p && NODE_TYPES[p.toUpperCase()]) return p.toUpperCase();
  } catch (e) {}
  return "A";
}
function writeVariant(v) {
  try {
    var url = new URL(window.location.href);
    url.searchParams.set("variant", v);
    window.history.replaceState({}, "", url);
  } catch (e) {}
}

function App() {
  var v = useState(readVariant()), variant = v[0], setVariant = v[1];
  var e = useState("production"), env = e[0], setEnv = e[1];
  var s = useState("baseline"), scenario = s[0], setScenario = s[1];
  var m = useState(true), showMetrics = m[0], setShowMetrics = m[1];
  var k = useState(null), selectedKey = k[0], setSelectedKey = k[1];

  useEffect(function () { writeVariant(variant); }, [variant]);

  // staging has no incident scenario in the fixture
  useEffect(function () { if (env === "staging" && scenario === "incident") setScenario("baseline"); }, [env]);
  useEffect(function () { if (selectedKey && !nodesFor(env).some(function (n) { return n.key === selectedKey; })) setSelectedKey(null); }, [env]);

  useEffect(function () {
    function onKey(ev) {
      var t = ev.target;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
      if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") {
        var i = VARIANTS.findIndex(function (x) { return x.key === variant; });
        var n = (i + (ev.key === "ArrowRight" ? 1 : -1) + VARIANTS.length) % VARIANTS.length;
        setVariant(VARIANTS[n].key); ev.preventDefault();
      }
      if (ev.key === "Escape") setSelectedKey(null);
    }
    window.addEventListener("keydown", onKey);
    return function () { window.removeEventListener("keydown", onKey); };
  }, [variant]);

  var graph = useMemo(function () {
    return buildGraph(variant, env, scenario, showMetrics, selectedKey);
  }, [variant, env, scenario, showMetrics, selectedKey]);

  var nodeTypes = useMemo(function () { return { A: NodeA, B: NodeB, C: NodeC }; }, []);

  var selectedNode = selectedKey ? nodeByKey(selectedKey) : null;
  var selectedState = selectedKey ? stateFor(scenario, env, selectedKey) : NO_ADAPTER;

  var ns = nodesFor(env);
  var counts = HEALTH_ORDER.map(function (hh) {
    return { h: hh, n: ns.filter(function (n) { return stateFor(scenario, env, n.key).health === hh; }).length };
  }).filter(function (c) { return c.n > 0; });

  var cur = VARIANTS.find(function (x) { return x.key === variant; });

  /* per-variant metrics control label */
  var metricsControl = h("button", {
    className: "toggle", "aria-pressed": showMetrics,
    onClick: function () { setShowMetrics(!showMetrics); }
  }, h("span", { className: "dot" }),
     variant === "C" ? (showMetrics ? "Signals shown" : "Topology only") : (showMetrics ? "Metrics on" : "Metrics off"));

  var rail = h("div", { className: "rail" },
    h("div", { className: "rail-brand" },
      h("b", null, "Nodqora"),
      h("span", { className: "eyebrow" }, "Payments pipeline")),
    h("div", { className: "rail-group" },
      h(Eyebrow, null, "Environment"),
      h("div", { className: "seg" }, ["production", "staging"].map(function (x) {
        return h("button", { key: x, "aria-pressed": env === x, onClick: function () { setEnv(x); } }, x);
      }))),
    h("div", { className: "rail-group" },
      h(Eyebrow, null, "Scenario"),
      h("div", { className: "seg" }, ["baseline", "incident"].map(function (x) {
        return h("button", { key: x, "aria-pressed": scenario === x, disabled: x === "incident" && env === "staging",
          title: x === "incident" && env === "staging" ? "The fixture defines the incident for production only" : undefined,
          onClick: function () { setScenario(x); } }, x);
      }))),
    metricsControl,
    h("div", { className: "rail-spacer" }),
    h("div", { className: "counts" },
      h("b", null, ns.length), " nodes · ", h("b", null, edgesFor(env).length), " edges  ",
      counts.map(function (c) {
        return h("span", { key: c.h, className: "legend-item", style: { display: "inline-flex", marginLeft: 10 } },
          h(HealthGlyph, { health: c.h, size: 10 }), h("span", { className: "mono" }, c.n));
      })),
    h("span", { className: "counts mono", style: { borderLeft: "1px solid var(--line)", paddingLeft: 14 } },
      ENV_CONFIG[env].namespace));

  /* Lane bands live in graph coordinates (ViewportPortal), so they pan and
     zoom with the nodes instead of sliding out from under them. */
  var laneOverlay = variant === "B"
    ? h(XY.ViewportPortal, null,
        h("div", { style: { position: "absolute", left: 0, top: 0, pointerEvents: "none", zIndex: -1 } },
          LANES.map(function (l, i) {
            var inLane = ns.filter(function (x) { return (x.ownerKey || "__none__") === l.key; });
            var maxLayer = 0;
            ns.forEach(function (x) { maxLayer = Math.max(maxLayer, graph.lay.layer[x.key]); });
            var width = GEOM.B.ox * 2 + maxLayer * GEOM.B.dx + GEOM.B.w;
            return h("div", { key: l.key, style: {
              position: "absolute", left: 0, top: 46 + i * LANE_H, width: width, height: LANE_H - 10,
              background: l.bg, borderRadius: 10, border: "1px solid var(--line)" } },
              h("div", { className: "b-lane-label" },
                h("b", null, l.label),
                h("span", { className: "mono" }, inLane.length + " node" + (inLane.length === 1 ? "" : "s"))));
          })))
    : null;

  var note = variant === "B"
    ? h("div", { className: "note" },
        h("b", null, "Ownership as the vertical axis. "),
        "The pipeline crosses from Payments Platform to Data Platform at the connectors — the hand-off this product exists to make visible.")
    : variant === "C"
      ? h("div", { className: "note" },
          h("b", null, "Signals are opt-out, not opt-in. "),
          "Every node shows its raw signal — the string health was normalised from — so the canvas never asks you to open a panel to see why something is amber.")
      : null;

  var stage;
  if (variant === "A") {
    stage = h("div", { className: "stage" },
      h("div", { className: "canvas-wrap" },
        h(Canvas, { graph: graph, variant: variant, nodeTypes: nodeTypes, env: env, showMetrics: showMetrics,
          onSelect: setSelectedKey })),
      h(DrawerInspector, { node: selectedNode, state: selectedState, env: env,
        onClose: function () { setSelectedKey(null); }, onSelect: setSelectedKey }));
  } else if (variant === "B") {
    stage = h(Fragment, null,
      h("div", { className: "stage" },
        h("div", { className: "canvas-wrap" },
          h(Canvas, { graph: graph, variant: variant, nodeTypes: nodeTypes, env: env, showMetrics: showMetrics,
            onSelect: setSelectedKey }, laneOverlay),
          note)),
      selectedNode ? h(PanelInspector, { node: selectedNode, state: selectedState, env: env,
        onClose: function () { setSelectedKey(null); }, onSelect: setSelectedKey }) : null);
  } else {
    stage = h("div", { className: "stage" },
      h("div", { className: "canvas-wrap" },
        h(Canvas, { graph: graph, variant: variant, nodeTypes: nodeTypes, env: env, showMetrics: showMetrics,
          onSelect: setSelectedKey }),
        note,
        selectedNode ? h(PopInspector, { node: selectedNode, state: selectedState, env: env,
          anchor: { right: 20, top: 20 },
          onClose: function () { setSelectedKey(null); }, onSelect: setSelectedKey }) : null));
  }

  var switcher = h("div", { className: "switcher", role: "group", "aria-label": "Prototype variant" },
    h("button", { onClick: function () { cycle(-1); }, "aria-label": "Previous variant" }, "‹"),
    h("span", { className: "label" }, h("b", null, cur.key), " — ", cur.name),
    h("button", { onClick: function () { cycle(1); }, "aria-label": "Next variant" }, "›"),
    h("span", { className: "hint" }, "← →"));

  function cycle(dir) {
    var i = VARIANTS.findIndex(function (x) { return x.key === variant; });
    setVariant(VARIANTS[(i + dir + VARIANTS.length) % VARIANTS.length].key);
  }

  return h(Fragment, null, rail, stage, switcher);
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));

})();
</script>
