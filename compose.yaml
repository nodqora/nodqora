#
# ADR-0150: this file is the Community install. `curl -LO`, `docker compose up`, then open
# http://localhost:8080.
# >>> tree-only
#
# Everything between these two markers is stripped by `./gradlew release` and never reaches the
# release asset, because it is addressed to a reader of this repository rather than to someone
# installing Nodqora. The rest of the file is rendered verbatim with `@VERSION@` substituted.
#
# The copy in the tree is deliberately not the install. `@VERSION@` is rendered by `./gradlew
# release` (ADR-0155), which writes `build/release/compose.yaml` and uploads *that* as the release
# asset. Two reasons it is a placeholder rather than a real tag:
#
#   * ADR-0143 makes a published version immutable, which is worth nothing if the compose file
#     naming it floats. A `:latest` here would be a runnable, unpinned install sitting on `main` —
#     and a runnable unpinned file is precisely the thing that gets copied out.
#   * ADR-0155 keeps the version in one home, the root `build.gradle.kts`. Committing the exact
#     number here would make `main` permanently advertise the *previous* release and give the
#     version a second place to drift from.
#
# So this file does not run as it stands, on purpose. To try an unreleased build, build the image
# locally and point the `image:` line at your own tag.
# <<< tree-only

services:
  nodqora:
    image: ghcr.io/nodqora/nodqora:@VERSION@
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Loopback only, so that `nodqora.authentication: none` means anyone on this machine rather
      # than anyone on the network; `"8080:8080"` would publish it on every interface the host has.
      # To reach it from another machine, declare an identity provider and put a proxy that
      # terminates TLS in front of it, or tunnel (`ssh -L 8080:localhost:8080 <host>`). Remove
      # `127.0.0.1:` only where a provider is declared, or where everyone who can reach the host may
      # see everything Nodqora shows.
      # https://github.com/nodqora/nodqora/blob/main/docs/install.md#it-listens-on-this-machine-only
      - "127.0.0.1:8080:8080"
    environment:
      # ADR-0150: the documented way to point at an existing PostgreSQL instead of the one below.
      NODQORA_DB_URL: jdbc:postgresql://postgres:5432/nodqora
      NODQORA_DB_USER: nodqora
      NODQORA_DB_PASSWORD: nodqora
    volumes:
      # ADR-0152. Your configuration: put an `application.yaml` in `./config` declaring
      # `nodqora.authentication` and `nodqora.environments` and nothing else — it merges with the one
      # inside the image, so the plugin orders, the refresh cadences and the cache and error settings
      # all inherit. This is Spring Boot's own default search location, which is why no flag names it.
      #
      # With this directory empty, Nodqora starts, serves nothing, and says that no identity provider
      # is configured (ADR-0173). That is the honest state of a new install, not a failure.
      # https://github.com/nodqora/nodqora/blob/main/docs/install.md#signing-in
      - ./config:/app/config
      # Your YAML topology, if you declare the `yaml` plugin: one directory per environment
      # (ADR-0061), so `./topology/production/*.yaml` for an environment keyed `production`.
      # Optional — an operator observing only Kubernetes and Kafka never mounts it. Read-only
      # because ADR-0064 makes the directory an authored artifact Nodqora only ever reads.
      - ./topology:/etc/nodqora/topology:ro
      # A kubeconfig, if an environment declares the `kubernetes` plugin and Nodqora is not running
      # inside that cluster. This container cannot see your `~/.kube/config`, and without a
      # kubeconfig every namespace fails to list. Write a self-contained one beside this file with
      # `kubectl config view --minify --flatten > kubeconfig`, change its `server:` away from
      # 127.0.0.1 — which inside this container is the container — uncomment the line below, add
      # `kubeconfig: "${file:/etc/nodqora/kubeconfig}"` beside `namespaces`, and `docker compose up
      # -d`. Commented out because Docker turns a missing bind-mount source into a directory.
      # https://github.com/nodqora/nodqora/blob/main/docs/install.md#kubernetes-needs-a-kubeconfig-in-the-container
      # - ./kubeconfig:/etc/nodqora/kubeconfig:ro

  postgres:
    # The version the integration tests already run, so the shipped path and the tested path are the
    # same database (ADR-0150).
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nodqora
      POSTGRES_USER: nodqora
      POSTGRES_PASSWORD: nodqora
    volumes:
      # Not incidental. ADR-0087 and ADR-0088 make the canvas reason about what it has seen before,
      # so a store that emptied on `docker compose down` would make the second `up` lie about
      # history.
      - nodqora-db:/var/lib/postgresql/data
    healthcheck:
      # `depends_on` alone waits for the container, not for the server, and Flyway runs at Nodqora's
      # startup — an unready database is a crash on the first `up` and a working install on the
      # retry, which is the worst kind of first impression.
      test: ["CMD-SHELL", "pg_isready -U nodqora -d nodqora"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  nodqora-db:
