# Three partitions each, so the two aggregator replicas both get work and Nodqora has a
# consumer group with real lag to report.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: market.trades.btc-usd
  namespace: market-demo
  labels: { strimzi.io/cluster: market }
spec:
  partitions: 3
  replicas: 1
  config:
    retention.ms: 86400000
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: market.trades.eth-usd
  namespace: market-demo
  labels: { strimzi.io/cluster: market }
spec:
  partitions: 3
  replicas: 1
  config:
    retention.ms: 86400000
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: market.ohlc.1m
  namespace: market-demo
  labels: { strimzi.io/cluster: market }
spec:
  partitions: 3
  replicas: 1
  config:
    retention.ms: 604800000
