# docs/reference-pipeline.md, staging, the payments-platform half.
#
# `environment:` is redundant against the directory by design (ADR-0061): staging is written by
# copying production, so a half-edited copy is this layout's characteristic failure and the guard
# belongs where the mistake is made.
environment: staging

owners:
  - key: payments-platform
    displayName: Payments Platform
    channel: "#payments-oncall"
    onCall: Payments SRE

types:
  - type: external-api
    label: External API
    category: external
    icon: cloud
  # ADR-0001: a descriptor is registered by plugins and by the YAML topology alike, and `service`
  # has no plugin behind it — ADR-0091 has `kubernetes` emit `topology.io/type` verbatim and guess
  # no label, category or icon for it, so without this line §2's two services render on the
  # fallback descriptor. This is not ADR-0063's anti-pattern: the veto it warns about is a `type:`
  # field on a node stanza, which would override whatever `kubernetes` reports forever. A
  # descriptor overrides nothing — it says how the type draws, not which type the node is.
  - type: service
    label: Service
    category: compute
    icon: service

nodes:
  - key: stripe-webhooks
    type: external-api
    displayName: Stripe Webhooks
    calls: [payments-api]

  - key: payments-api
    producesTo: [payments.events.raw.v1]

  - key: payments-enricher
    consumesFrom: [payments.events.raw.v1]
    producesTo: [payments.events.enriched.v1]
    consumerGroups: [enrich-consumer-staging]

  - key: payments.events.raw.v1
    owner: payments-platform

  - key: payments.events.enriched.v1
    owner: payments-platform
