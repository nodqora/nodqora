spring:
  application:
    name: nodqora
  datasource:
    url: ${NODQORA_DB_URL:jdbc:postgresql://localhost:5432/nodqora}
    username: ${NODQORA_DB_USER:nodqora}
    password: ${NODQORA_DB_PASSWORD:nodqora}
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: always   # ADR-0058: the API returns nulls unresolved.
  mvc:
    # ADR-0060: errors are RFC 9457 problem+json. Without this only the errors we raise ourselves
    # are, and an unknown path or an unhandled failure returns Spring's default body instead — so
    # the frontend's one error path would read `detail` off a document that has none.
    problemdetails:
      enabled: true
  web:
    resources:
      cache:
        cachecontrol:
          # ADR-0151: index.html has a fixed name and names the content-hashed bundles, so it is the
          # one file a browser must revalidate — a stale copy after an upgrade points at bundles the
          # new image no longer has. `/assets/**` overrides this with a year of immutability in
          # FrontendCacheHeaders; specificity, not order, decides which handler serves a request.
          no-cache: true

server:
  port: 8080

logging:
  level:
    io.nodqora: INFO

nodqora:
  # The two orders over plugin ids (ADR-0011, ADR-0044, ADR-0050). They live here rather than in
  # core source because ADR-0015 forbids the core naming a plugin at all, and because ADR-0011 says
  # precedence is "expressed as config over plugin ids, not baked into the interface".
  #
  # Registry order is the canonical order of `sources[]` and the order rawSignal contributions join
  # in. It is CONTEXT.md's own worked example read left to right: `payments-es-sink` reads
  # "2 desired / 2 ready; lag 120; RUNNING, 3/3 tasks RUNNING", which is kubernetes, then kafka,
  # then connect.
  #
  # Precedence settles a contested scalar, first non-null wins: manual beats connector config beats
  # Kubernetes config, with kafka last. `connect` sits second because it is the authority on a
  # connector's own type, above `kubernetes`, which only ever sees the StatefulSet hosting it;
  # `kafka` sits last because a topic's key is all it is sure of, and every scalar it could contest
  # is one another writer knows better. They are genuinely different orders.
  #
  # Both lists must name exactly the registered plugins, checked at startup: a misspelled id would
  # otherwise sort last in silence and the graph would go on being folded with the wrong precedence.
  plugins:
    registry-order: [yaml, kubernetes, kafka, connect]
    precedence: [yaml, connect, kubernetes, kafka]

  # ADR-0035, ADR-0042. Timeouts sit strictly below their interval (see DiscoveryEngine).
  refresh:
    discovery: 5m
    health: 30s

  # ADR-0004, ADR-0014: environment is a first-class entity holding its own discovery connection
  # configuration, declared in a file and bound at startup. Declaration order is ADR-0077's second
  # tiebreak for a contested type descriptor.
  environments:
    production:
      display-name: Production
      plugins:
        # ADR-0061: one directory per environment, every *.yaml in it read together as one snapshot.
        yaml: { dir: fixtures/reference-pipeline/production }
        # ADR-0035: enumerated namespaces, required and non-empty, with no wildcard and no `all`
        # mode -- a forgotten namespace should read as "half my graph is gone" rather than as one
        # subtly absent node, which ADR-0004 cannot tell from real drift. One cluster per
        # environment, so `<namespace>/<name>` stays unique as a backing reference.
        kubernetes:
          namespaces: [payments-prod]
          # ADR-0031: exact `kind/name`, no globs and no regex. `kafka-connect` hosts both
          # connectors and is not itself a node; suppression removes node emission only, so
          # `connect` can still stamp it as a backing on both of them.
          ignore: [statefulset/kafka-connect]
          # ADR-0032: the annotations hold ids, and the URL is composed here -- which is what lets
          # one manifest render correctly in production and in staging. No template, no link.
          links:
            workload: "https://k8s.acme.io/{namespace}/{kind}/{name}"
            pods: "https://k8s.acme.io/{namespace}/{kind}/{name}/pods"
            logs: "https://grafana.acme.io/explore?ns={namespace}&app={name}"
            dashboard: "https://grafana.acme.io/d/{value}"
            gitops: "https://argocd.acme.io/applications/{value}"
        # ADR-0090: a required, non-empty include-prefix list with an exact-name `ignore`. There is
        # no default and the default would have been *everything* -- on a shared Connect cluster,
        # every team's connectors on the payments canvas.
        connect:
          url: https://connect-prod.internal:8083
          connectors:
            include: [payments-]
            ignore: [payments-debug-reprocessor]
          # ADR-0022: the workload this cluster runs on, stamped onto every connector. `kubernetes`
          # suppresses the StatefulSet from node emission by exact name (ADR-0031) and is then handed
          # the two connector nodes to observe -- suppression removes emission, not readability.
          workload:
            plugin: kubernetes
            kind: statefulset
            reference: payments-prod/kafka-connect
          # ADR-0039: one variable, `{name}`. `config` MUST point at a UI -- research #5 verified
          # that `GET /connectors/{name}/config` applies no masking of any kind, so a connector with
          # an inlined password serves it in plaintext to whoever clicks.
          links:
            connector: "https://connect-ui.acme.io/prod/{name}"
            logs: "https://grafana.acme.io/explore?connector={name}"
            config: "https://connect-ui.acme.io/prod/{name}/config"
        # ADR-0037: prefix scope, required. `listInternal: false` is set below the seam and is not
        # sufficient -- Connect's `connect-*` topics are ordinary topics to Kafka, so `ignore`
        # removes them by exact name.
        kafka:
          bootstrap: kafka-prod.internal:9092
          topics:
            include: [payments.]
            ignore: [connect-offsets]
          # ADR-0025, ADR-0042: one threshold, not a pair, keyed by consumer group, and required --
          # a built-in number turns nodes amber because of a threshold nobody chose.
          lag:
            default: 10000
          # §9 gives a topic one link, so one template is configured. No template, no link.
          links:
            dashboard: "https://grafana.acme.io/d/kafka-topic?var-topic={name}"
    staging:
      display-name: Staging
      plugins:
        yaml: { dir: fixtures/reference-pipeline/staging }
        kubernetes:
          namespaces: [payments-staging]
          ignore: [statefulset/kafka-connect]
          links:
            workload: "https://k8s-staging.acme.io/{namespace}/{kind}/{name}"
            pods: "https://k8s-staging.acme.io/{namespace}/{kind}/{name}/pods"
            logs: "https://grafana-staging.acme.io/explore?ns={namespace}&app={name}"
            dashboard: "https://grafana-staging.acme.io/d/{value}"
            gitops: "https://argocd-staging.acme.io/applications/{value}"
        connect:
          url: https://connect-staging.internal:8083
          connectors:
            include: [payments-]
            ignore: [payments-debug-reprocessor]
          workload:
            plugin: kubernetes
            kind: statefulset
            reference: payments-staging/kafka-connect
          links:
            connector: "https://connect-ui-staging.acme.io/staging/{name}"
            logs: "https://grafana-staging.acme.io/explore?connector={name}"
            config: "https://connect-ui-staging.acme.io/staging/{name}/config"
        kafka:
          bootstrap: kafka-staging.internal:9092
          topics:
            include: [payments.]
            ignore: [connect-offsets]
          lag:
            default: 10000
          links:
            dashboard: "https://grafana-staging.acme.io/d/kafka-topic?var-topic={name}"
